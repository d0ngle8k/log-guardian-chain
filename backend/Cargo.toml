[package]
name = "log-guardian-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.4", features = ["multipart"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
tower-http = { version = "0.6.6", features = ["cors", "trace", "limit"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
sha2 = "0.10.9"
hex = "0.4.3"
uuid = { version = "1.18.0", features = ["v4", "serde"] }
postgres = "0.19"
rand = "0.9.2"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart"] }
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"
jsonwebtoken = "9"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
tempfile = "3"